name: "CodeQL Config"

queries:
  - uses: security-and-quality
  - uses: security-extended

paths:
  # Every module lives in the package now. downloader.py, uploader.py and
  # performance_tracker.py are no longer at the root, and naming a missing
  # path here stops the scan before it starts.
  - youtube_shorts

paths-ignore:
  - '**/test/**'
  - '**/*.test.py'
  - '**/node_modules/**'
  - '**/vendor/**'
